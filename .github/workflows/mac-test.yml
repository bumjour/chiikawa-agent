# 맥에서 실제로 켜지는지 확인 (수동 실행): 소스로 맥 앱을 만들어 → 실행 → 오류 기록 출력
name: mac-test

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: macos-latest # M칩
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 맥 앱 만들기 (설치 파일 없이 앱만)
        run: npx electron-builder --mac --arm64 --dir --publish never -c.productName="Chiikawa Agent"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: 실행해 보기 (20초)
        shell: bash {0}
        run: |
          APP="$(ls -d dist/mac-arm64/*.app | head -1)"
          echo "앱: $APP"; ls "$APP/Contents/MacOS"
          "$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | head -1)" > run.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then echo "RESULT: 20초 뒤에도 실행 중 (정상)"; kill $PID; else wait $PID; echo "RESULT: 꺼짐 (exit $?)"; fi
          echo "----- 실행 출력 -----"; tail -n 60 run.log
          echo "----- agent.log -----"; tail -n 30 ~/Library/Application\ Support/*/agent.log 2>/dev/null
          echo "----- 충돌 기록 -----"
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do [ -f "$f" ] && { echo "== $f"; head -c 3000 "$f"; echo; }; done
          true
