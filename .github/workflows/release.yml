# 태그(v0.2.1 등)를 올리면 Windows·macOS 설치 파일을 만들어 Releases에 자동으로 올려요.
# 맥 파일은 맥에서만 만들 수 있어서 GitHub가 빌려주는 macOS 서버에서 만들어요.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # 수동 실행: tag를 비우면 설치 파일만 만들어 보고, 적으면 그 버전 Releases 파일을 새로 만든 걸로 교체
    inputs:
      tag:
        description: '파일을 교체할 Releases 태그 (예: v0.2.1). 비우면 올리지 않음'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Windows 설치 파일
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: macOS 설치 파일 (M칩 + 인텔)
        if: runner.os == 'macOS'
        # 맥 dmg는 한글 이름을 자음·모음으로 쪼개 저장해서 앱이 켜지자마자 꺼져요 → 맥 앱 이름만 영어로
        run: npx electron-builder --mac --publish never -c.productName="Chiikawa Agent"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # 애플 인증서 없음 → 임시(ad-hoc) 서명

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-assets
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 가이드 PDF 함께 올리기, 맥 파일 이름을 칩 이름으로
        run: |
          cp release-assets/*.pdf dist/ 2>/dev/null || true
          cd dist
          [ -f ChiikawaAgent-Mac-arm64.dmg ] && mv ChiikawaAgent-Mac-arm64.dmg ChiikawaAgent-Mac-AppleSilicon.dmg
          [ -f ChiikawaAgent-Mac-x64.dmg ] && mv ChiikawaAgent-Mac-x64.dmg ChiikawaAgent-Mac-Intel.dmg
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: 치이카와 에이전트 ${{ inputs.tag || github.ref_name }}
          files: dist/*
          overwrite_files: true
          body: |
            ## ⬇️ 바로 받기 (눌러서 다운로드)
            | 내 컴퓨터 | 다운로드 |
            |---|---|
            | 🪟 **Windows 10 / 11** | **[ChiikawaAgent-Windows.exe](https://github.com/bumjour/chiikawa-agent/releases/download/${{ inputs.tag || github.ref_name }}/ChiikawaAgent-Windows.exe)** |
            | 🍎 **맥 · M1~M4 칩** | **[ChiikawaAgent-Mac-AppleSilicon.dmg](https://github.com/bumjour/chiikawa-agent/releases/download/${{ inputs.tag || github.ref_name }}/ChiikawaAgent-Mac-AppleSilicon.dmg)** |
            | 💻 **맥 · 인텔 칩** | **[ChiikawaAgent-Mac-Intel.dmg](https://github.com/bumjour/chiikawa-agent/releases/download/${{ inputs.tag || github.ref_name }}/ChiikawaAgent-Mac-Intel.dmg)** |
            | 📄 **설치 가이드 PDF** | **[ChiikawaAgent-Guide.pdf](https://github.com/bumjour/chiikawa-agent/releases/download/${{ inputs.tag || github.ref_name }}/ChiikawaAgent-Guide.pdf)** |

            더 보기 쉬운 다운로드 페이지: **https://bumjour.github.io/chiikawa-agent/**
            맥 칩 확인:  메뉴 → 이 Mac에 관하여 → '칩'이 Apple M○ 이면 M칩, Intel 이면 인텔

            ## 설치할 때
            - **Windows**: "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**
            - **맥**: 처음 열 때 경고가 뜨면 **시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기**
              ("손상되었기 때문에 열 수 없습니다"가 뜨면 터미널에 `xattr -cr "/Applications/Chiikawa Agent.app"`)

            ## 고지
            비공식 팬메이드 · 비영리 무료 배포. 「ちいかわ」의 모든 권리는 nagano 및 권리자에게 있으며, 요청 시 즉시 배포를 중단합니다. 캐릭터 예시 이미지는 팬 사이트·팬 제작 이미지이며, 권리자 요청 시 즉시 삭제합니다.
