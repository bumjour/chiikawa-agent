<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bubble" class="hidden">
    <button id="closeBtn" title="닫기">×</button>
    <div id="lines">
      <div id="ko"></div>
    </div>
    <form id="chatForm" class="hidden">
      <input id="chatInput" autocomplete="off" placeholder="말 걸기…">
    </form>
    <form id="scheduleForm" class="hidden">
      <div class="rowHead"><span>시간</span><span>내용</span></div>
      <div id="rows"></div>
      <button type="button" id="addRowBtn" class="link">+ 일정 추가</button>
      <button type="submit" id="saveBtn">저장하고 들려줘</button>
    </form>
    <div id="updateBar" class="hidden"><button id="updateBtn" class="primaryBtn"></button></div>
    <div id="schedBar" class="hidden">
      <button id="editBtn" class="pill">📋 전체 일정 확인</button>
      <button id="modeBtn" class="pill"></button>
    </div>
  </div>
  <div id="pet"></div>
  <!-- 크기·투명도 조절: 모서리 점을 끌어 크기, 아래 막대로 투명도 -->
  <div id="adjustBox" class="hidden">
    <span class="handle" data-c="nw"></span><span class="handle" data-c="ne"></span>
    <span class="handle" data-c="sw"></span><span class="handle" data-c="se"></span>
  </div>
  <div id="adjustBar" class="hidden">
    <span class="ic" title="투명하게">◌</span>
    <input id="opacity" type="range" min="10" max="100" step="1">
    <span class="ic" title="또렷하게">●</span>
    <button id="adjustDone" title="완료">완료</button>
  </div>
  <div id="nameTag"></div>
  <script src="placeholder.js"></script>
  <script src="pet.js"></script>
</body>
</html>
