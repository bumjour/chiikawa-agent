<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 홍보 영상용: 캐릭터 7종을 한 줄로 세우고 말풍선을 차례로 띄워요 (npm run demo) */
    html, body { background: transparent; }
    #row {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: center; align-items: flex-end; gap: 14px;
    }
    .slot { position: relative; width: 236px; height: 560px; }
    .slot .pet {
      position: absolute; bottom: 26px; left: 50%; width: 150px; height: 150px; margin-left: -75px;
    }
    .slot .pet img, .slot .pet svg { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.28)); }
    .slot .tag {
      position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
      padding: 1px 9px; border-radius: 999px; background: rgba(255, 253, 248, 0.85);
      white-space: nowrap; font-size: 12px; font-weight: 700; color: #5b4a3f;
    }
    .slot .bubble {
      position: absolute; bottom: 188px; left: 50%; transform: translateX(-50%) scale(0.8);
      width: 224px; box-sizing: border-box; padding: 11px 13px;
      background: #fffdf8; border: 2.5px solid #4a3b33; border-radius: 18px; color: #3b2f28;
      box-shadow: 0 4px 0 rgba(74, 59, 51, 0.15), 0 8px 24px rgba(0, 0, 0, 0.25);
      opacity: 0; transition: opacity 0.18s ease-out, transform 0.22s ease-out;
    }
    .slot .bubble::after {
      content: ""; position: absolute; bottom: -12px; left: 50%; margin-left: -10px;
      border: 10px solid transparent; border-top-color: #4a3b33; border-bottom: 0;
    }
    .slot .bubble.on { opacity: 1; transform: translateX(-50%) scale(1); }
    .slot .ko { font-size: 14px; font-weight: 700; line-height: 1.45; }
    .slot .ja { display: none; } /* 일본어 번역은 쓰지 않아요 */
    .slot .pet.hop { animation: hop 0.45s ease-in-out 2; }
    /* 소품: 쿠리만쥬 맥주잔 (직접 그린 그림) */
    .slot .pet svg.prop { position: absolute; width: 46px; height: 55px; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.25)); }
    .slot .pet svg.prop.beer { right: -14px; top: 40px; transform: rotate(16deg); }
    /* 세로 영상: 4명 + 3명 두 줄 */
    body.portrait #row { flex-wrap: wrap; max-width: 1040px; margin: 0 auto; gap: 0 10px; }
    body.portrait .slot { width: 248px; height: 440px; }
  </style>
</head>
<body>
  <div id="row"></div>
  <script src="placeholder.js"></script>
  <script>
    if (new URLSearchParams(location.search).get('layout') === 'portrait') document.body.classList.add('portrait');
    // 맥주잔 (거품 + 손잡이), 캐릭터 손 쪽에 겹쳐 그려요
    const BEER = `<svg class="prop beer" viewBox="0 0 62 74" xmlns="http://www.w3.org/2000/svg">
      <path d="M44 26 h7 a8 8 0 0 1 8 8 v12 a8 8 0 0 1 -8 8 h-7" fill="none" stroke="#4a3b33" stroke-width="4"/>
      <rect x="8" y="20" width="38" height="50" rx="5" fill="#f6b73c" stroke="#4a3b33" stroke-width="4"/>
      <path d="M16 30 v32 M26 30 v32 M36 30 v32" stroke="#ffd77a" stroke-width="3" stroke-linecap="round"/>
      <path d="M6 22 q3 -12 12 -10 q4 -9 13 -4 q8 -6 14 2 q9 0 7 12 z" fill="#fffdf6" stroke="#4a3b33" stroke-width="3.5" stroke-linejoin="round"/>
    </svg>`;
    // 앱(pet.js)과 같은 방식: 그림의 투명 여백을 빼고 보이는 키 128px, 발끝을 같은 선에
    function fit(img) {
      try {
        const w = img.naturalWidth, h = img.naturalHeight;
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const g = cv.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
        const d = g.getImageData(0, 0, w, h).data;
        let x0 = w, y0 = h, x1 = -1, y1 = -1;
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        if (x1 >= 0) {
          const s = Math.min(128 / (y1 - y0 + 1), 190 / (x1 - x0 + 1));
          Object.assign(img.style, { position: 'absolute', width: w * s + 'px', height: h * s + 'px',
            left: 75 - ((x0 + x1 + 1) / 2) * s + 'px', top: 150 - (y1 + 1) * s + 'px' });
        }
      } catch {}
      img.style.visibility = '';
    }
    // main(demo.js)이 setLineup(cast)로 캐릭터 목록을 넘겨요: [{ id, nameKo, color, image, ko, ja, prop }]
    function setLineup(cast) {
      const row = document.getElementById('row');
      row.innerHTML = '';
      for (const c of cast) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.innerHTML = '<div class="bubble"><div class="ko"></div><div class="ja"></div></div><div class="pet"></div><div class="tag"></div>';
        slot.querySelector('.ko').textContent = c.ko;
        slot.querySelector('.ja').textContent = c.ja || '';
        slot.querySelector('.tag').textContent = c.nameKo;
        slot.querySelector('.pet').innerHTML = c.image ? '<img alt="">' : placeholderSvg(c.id, c.color);
        if (c.image) { const img = slot.querySelector('.pet img'); img.style.visibility = 'hidden'; img.onload = () => fit(img); img.src = c.image; }
        if (c.prop === 'beer') slot.querySelector('.pet').insertAdjacentHTML('beforeend', BEER);
        row.appendChild(slot);
      }
    }
    // i번째 캐릭터 말풍선 띄우기 (통통 튀면서)
    function speak(i) {
      const slot = document.querySelectorAll('.slot')[i];
      if (!slot) return;
      slot.querySelector('.bubble').classList.add('on');
      const pet = slot.querySelector('.pet');
      pet.classList.remove('hop'); void pet.offsetWidth; pet.classList.add('hop');
    }
  </script>
</body>
</html>
